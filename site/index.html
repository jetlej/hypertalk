.badge svg { width: 20px; height: 20px; color: var(--green); }
.badge b { font-weight: 600; color: var(--green); }

/* The giant condensed title, filled with a light gradient. */
.title {
    margin-top: 22px;
    font-family: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
    font-weight: 400;
    font-size: min(17vw, 248px);
    line-height: 0.95;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #dfe9ff 40%, #9fb8ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
h2 {
    margin-top: 0.45em;
    font-size: clamp(28px, 4.6vw, 54px);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.1;
    text-wrap: balance;
}
h2 .soft { color: var(--soft); }
/* The time, in the light blue of the title's gradient. */
h2 .time {
    background: linear-gradient(180deg, #ffffff, #9fb8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
}

.download {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 44px;
    height: 62px;
    padding: 0 32px;
    border-radius: 999px;
    font-size: 19px;
    font-weight: 600;
    color: #000;
    text-decoration: none;
    background: linear-gradient(180deg, #ffffff, #d7e3ff);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4), 0 12px 50px rgba(60, 90, 255, 0.55);
    transition: transform 0.15s, box-shadow 0.2s;
}
.download:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6), 0 16px 60px rgba(60, 90, 255, 0.75); }
.download svg { width: 22px; height: 22px; }

/* ---------- Features: one row, each with an icon ---------- */
.features {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px 40px;
    max-width: 1000px;
    margin: 52px auto 0;
    list-style: none;
}
.features li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 500;
    color: var(--soft);
    white-space: nowrap;
}
.features svg { width: 22px; height: 22px; color: var(--ice); flex: none; }

/* ---------- Motion ---------- */
.in { opacity: 0; transform: translateY(16px); animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.16s; } .d3 { animation-delay: 0.26s; } .d4 { animation-delay: 0.36s; } .d5 { animation-delay: 0.46s; }
@keyframes rise { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
    .in { opacity: 1; transform: none; animation: none; }
}

@media (max-width: 760px) {
    main { padding: 48px 16px; }
    .badge { font-size: 14px; }
    .features { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; margin-top: 44px; }
    .features li { font-size: 15px; white-space: normal; text-align: left; }
}
