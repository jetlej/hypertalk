  <script>
    // The state at L is the state at 0 (the pill, its bars low), so the video
    // loops with no seam.
    const tl = gsap.timeline({ paused: true });
    const L = 11.4;

    // The glow breathes once per loop.
    tl.fromTo("#hero-glow", { scale: 1, opacity: 0.92 }, { scale: 1.06, opacity: 1, duration: L / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

    // 0–1.9 s: the pill listens. Each bar rises and falls a whole number of
    // times, so it ends low, where it started.
    const peaks = [0.45, 0.7, 0.9, 1, 0.85, 0.65, 0.45];
    const beats = [0.25, 0.21, 0.27, 0.23, 0.26, 0.2, 0.24];
    gsap.utils.toArray("#hero-pill .hero-bar").forEach((bar, i) => {
      const swings = Math.floor(1.7 / (beats[i] * 2));
      tl.fromTo(bar, { scaleY: 0.18 }, { scaleY: peaks[i], duration: beats[i], ease: "sine.inOut", yoyo: true, repeat: swings * 2 - 1 }, 0.1 + i * 0.02);
    });

    // Then each claim takes the slot for 1.6 s: out goes up, in comes from below.
    const out = (el, at) => tl.to(el, { opacity: 0, y: -24, scale: 0.94, duration: 0.25, ease: "power2.in" }, at);
    const into = (el, at, first) => tl.fromTo(el, { opacity: 0, y: 28, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: first }, at);
    const order = ["#hero-speed", "#hero-private", "#hero-learns", "#hero-free", "#hero-offline"];
    let at = 2.0;
    out("#hero-pill", at);
    order.forEach((chip, i) => {
      into(chip, at + 0.15, true);
      at += 1.75;
      out(chip, at);
    });

    // Back to the pill, still, before the loop starts it listening again.
    // immediateRender off: the pill is visible from 0 s, not held at this tween's start.
    into("#hero-pill", at + 0.15, false);

    window.__timelines["hero"] = tl;
  </script>
