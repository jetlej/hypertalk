  <script>
    // The state at L is the state at 0 (the tagline, alone), so the video
    // loops with no seam.
    const tl = gsap.timeline({ paused: true });
    // The tagline for 2 s, five claims of 1.6 s, the tagline back for its last 2 s.
    const STEP = 1.6;
    const L = 2.0 + 5 * STEP + 0.15 + 2.05;

    // The glow breathes once per loop.
    tl.fromTo("#hero-glow", { scale: 1, opacity: 0.92 }, { scale: 1.06, opacity: 1, duration: L / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

    // 0–2 s: the tagline. Then each claim takes the slot for 1.6 s: out goes
    // up, in comes from below.
    const out = (el, at) => tl.to(el, { opacity: 0, y: -24, scale: 0.94, duration: 0.25, ease: "power2.in" }, at);
    const into = (el, at, first) => tl.fromTo(el, { opacity: 0, y: 28, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: first }, at);
    const order = ["#hero-speed", "#hero-private", "#hero-learns", "#hero-free", "#hero-offline"];
    let at = 2.0;
    out("#hero-tagline", at);
    order.forEach((chip) => {
      into(chip, at + 0.15, true);
      at += STEP;
      out(chip, at);
    });

    // The tagline again, landed before the loop ends.
    // immediateRender off: it is visible from 0 s, not held at this tween's start.
    into("#hero-tagline", at + 0.15, false);

    window.__timelines["hero"] = tl;
  </script>
