<template>
  <style>
    @font-face {
      font-family: "Anton";
      src: url("assets/fonts/Anton-Regular.woff2") format("woff2");
      font-weight: 400;
    }
    #root {
      position: absolute;
      inset: 0;

      background: #000;

      font-family: "Inter", sans-serif;
      text-align: center;
    }
    /* The homepage's light: electric blue under the title, teal at the corners. */
    #hero-glow {
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(62% 46% at 50% 62%, rgba(47, 61, 255, 0.95) 0%, rgba(30, 35, 200, 0.5) 40%, transparent 75%),
        radial-gradient(42% 46% at 0% 18%, rgba(14, 110, 120, 0.55), transparent 70%),
        radial-gradient(42% 46% at 100% 18%, rgba(14, 110, 120, 0.5), transparent 70%);
    }
    #hero-title {
      position: absolute;
      left: 0;
      right: 0;
      top: 48px;
      font-family: "Anton", sans-serif;
      font-weight: 400;
      font-size: 252px;
      line-height: 1.15;
      letter-spacing: -0.005em;
      background: linear-gradient(180deg, #ffffff 0%, #dfe9ff 40%, #9fb8ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    /* One slot under the title: the pill listening, then the result. */
    #hero-pill {
      position: absolute;
      left: 440px;
      top: 410px;
      width: 320px;
      height: 124px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 999px;
      background: #101212;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.55), 0 0 80px rgba(47, 61, 255, 0.5);
    }
    .hero-bar { width: 10px; height: 72px; border-radius: 5px; background: #b5d1ff; }
    #hero-speed {
      position: absolute;
      left: 245px;
      top: 410px;
      width: 710px;
      height: 124px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border-radius: 999px;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: #e4ffef;
      background: rgba(18, 183, 106, 0.24);
      border: 2px solid rgba(80, 230, 150, 0.6);
      box-shadow: 0 0 80px rgba(18, 183, 106, 0.6);
      opacity: 0;
    }
    #hero-speed svg { width: 56px; height: 56px; }
  </style>
  <div id="root" data-composition-id="hero" data-width="1200" data-height="630" data-layout-allow-overlap>
    <div id="hero-glow" data-layout-allow-overflow></div>
    <div id="hero-title">HYPERTALK</div>
    <div id="hero-pill">
      <i class="hero-bar"></i><i class="hero-bar"></i><i class="hero-bar"></i><i class="hero-bar"></i><i class="hero-bar"></i><i class="hero-bar"></i><i class="hero-bar"></i>
    </div>
    <div id="hero-speed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      Typed in 0.1s
    </div>
  </div>
  <script>
    // 6 s, and the state at 6 s is the state at 0 s, so the video loops with no seam.
    const tl = gsap.timeline({ paused: true });
    const L = 6;

    // The glow breathes once per loop.
    tl.fromTo("#hero-glow", { scale: 1, opacity: 0.92 }, { scale: 1.06, opacity: 1, duration: L / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

    // 0–2.5 s: the pill listens. Each bar rises and falls a whole number of
    // times, so it ends low, where it started.
    const peaks = [0.45, 0.7, 0.9, 1, 0.85, 0.65, 0.45];
    const beats = [0.25, 0.21, 0.27, 0.23, 0.26, 0.2, 0.24];
    gsap.utils.toArray("#hero-pill .hero-bar").forEach((bar, i) => {
      const swings = Math.floor(2.3 / (beats[i] * 2));
      tl.fromTo(bar, { scaleY: 0.18 }, { scaleY: peaks[i], duration: beats[i], ease: "sine.inOut", yoyo: true, repeat: swings * 2 - 1 }, 0.1 + i * 0.02);
    });

    // 2.5 s: the pill closes and the result lands, big.
    tl.to("#hero-pill", { opacity: 0, scale: 0.7, duration: 0.25, ease: "power2.in" }, 2.5);
    tl.fromTo("#hero-speed", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 2.7);

    // 5.2 s: the result clears and the pill is back, listening again from the top.
    tl.to("#hero-speed", { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in" }, 5.2);
    // immediateRender off: the pill is visible from 0 s, not held at this tween's start.
    tl.fromTo("#hero-pill", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, 5.5);

    window.__timelines["hero"] = tl;
  </script>
</template>
