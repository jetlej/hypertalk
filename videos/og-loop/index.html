<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- Hypertalk's share video (og:video): one 12.2 s scene that loops seamlessly. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12.2"
      data-width="1200"
      data-height="630"
    >
      <div
        id="hero"
        data-composition-id="hero"
        data-composition-src="compositions/hero.html"
        data-start="0"
        data-duration="12.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1200"
        data-height="630"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
